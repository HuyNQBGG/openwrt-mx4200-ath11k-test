name: Build TB1 MX4200 v1 ath11k with preserved services

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx4200-v1-build
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd \
            libelf-dev libtool autoconf automake cmake pkgconf texinfo xsltproc
          df -h .
          free -h

      - name: Checkout pinned OpenWrt release
        run: |
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          test "$(git -C openwrt rev-parse HEAD)" = f0a60eee2fe051741c643ea6118718aae1ef17fb
          mkdir -p evidence
          git -C openwrt rev-parse HEAD > evidence/openwrt-commit.txt
          cp openwrt/feeds.conf.default evidence/feeds.conf.default

      - name: Install release-pinned feeds and recipe
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          git init ../service-overlay
          git -C ../service-overlay fetch --depth 1 https://github.com/openwrt/packages.git 5d6ecf4803ed041c9f76271e1d1e27e976a68c72
          git -C ../service-overlay checkout FETCH_HEAD -- net/tailscale lang/golang
          rsync -a --delete ../service-overlay/net/tailscale/ feeds/packages/net/tailscale/
          rsync -a --delete ../service-overlay/lang/golang/ feeds/packages/lang/golang/
          git -C ../service-overlay fetch --depth 1 https://github.com/openwrt/packages.git bcf4ecc04c36eced377a33422525283e6c4bf3f4
          git -C ../service-overlay checkout FETCH_HEAD -- net/adblock-fast
          rsync -a --delete ../service-overlay/net/adblock-fast/ feeds/packages/net/adblock-fast/
          cp ../config/tb1-service-pins.txt ../evidence/
          grep -qx 'PKG_VERSION:=1.102.3' feeds/packages/net/tailscale/Makefile
          grep -qx 'PKG_RELEASE:=1' feeds/packages/net/tailscale/Makefile
          grep -qx 'PKG_VERSION:=1.2.4' feeds/packages/net/adblock-fast/Makefile
          grep -qx 'PKG_RELEASE:=4' feeds/packages/net/adblock-fast/Makefile
          ./scripts/feeds install -a
          cp ../config/tb1.config .config
          cp ../patches/950-ath11k-five-rings-mx4200.patch package/kernel/mac80211/patches/ath11k/
          python3 ../scripts/bump-release.py package/kernel/mac80211/Makefile
          make defconfig
          cp .config ../evidence/full.config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_linksys_mx4200v1=y' .config
          grep -qx 'CONFIG_PACKAGE_wpad-mbedtls=y' .config
          missing_packages=0
          while IFS= read -r package_line; do
            case "$package_line" in
              CONFIG_PACKAGE_*=y)
                if ! grep -Fqx "$package_line" .config; then
                  echo "::error::Requested build package missing after defconfig: $package_line"
                  missing_packages=1
                fi
                ;;
            esac
          done < ../config/tb1.config
          test "$missing_packages" -eq 0
          if grep -q '^CONFIG_PACKAGE_wpad-basic-mbedtls=y' .config; then exit 1; fi
          if grep -q '^CONFIG_PACKAGE_mesh11sd=y' .config; then exit 1; fi
          ./scripts/diffconfig.sh > ../evidence/diffconfig.txt
          cp .config ../evidence/full.config

      - name: Download and verify driver patch application
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tee ../evidence/download.log
          echo '2ad578c6cae22f192fefd44e1449725228d4109ee781998b41dcbae872554968  dl/backports-6.18.26.tar.zst' | sha256sum -c -
          make package/kernel/mac80211/prepare -j2 V=s 2>&1 | tee ../evidence/driver-prepare.log
          python3 ../scripts/verify-rings.py build_dir

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../evidence/build.log

      - name: Collect firmware and evidence
        run: |
          set -euo pipefail
          mkdir -p artifact
          target_dir=openwrt/bin/targets/qualcommax/ipq807x
          ls -lh "$target_dir"
          shopt -s nullglob
          candidates=("$target_dir"/openwrt*-qualcommax-ipq807x-linksys_mx4200v1-squashfs-sysupgrade.bin)
          test "${#candidates[@]}" -eq 1
          image="${candidates[0]}"
          test -s "$image"
          cp "$image" artifact/
          openwrt/staging_dir/host/bin/fwtool -i artifact/image-metadata.json "$image"
          python3 -c 'import json; m=json.load(open("artifact/image-metadata.json")); assert "linksys,mx4200v1" in m["supported_devices"], m; assert m["version"]["version"] == "25.12.5", m; assert m["version"]["target"] == "qualcommax/ipq807x", m'
          cp openwrt/bin/targets/qualcommax/ipq807x/*.manifest artifact/
          if grep -Eq '^mesh11sd[[:space:]]' artifact/*.manifest; then exit 1; fi
          grep -Eq '^wpad-mbedtls[[:space:]]' artifact/*.manifest
          grep -Eq '^tailscale - 1\.102\.3-r1$' artifact/*.manifest
          grep -Eq '^adblock-fast - 1\.2\.4-r4$' artifact/*.manifest
          for pkg in luci-app-tailscale-community luci-app-adblock-fast luci-app-wol etherwake kmod-tun; do grep -Eq "^$pkg - " artifact/*.manifest; done
          cp evidence/tb1-service-pins.txt artifact/
          cp openwrt/bin/targets/qualcommax/ipq807x/profiles.json artifact/
          cp patches/950-ath11k-five-rings-mx4200.patch artifact/
          cp README.md artifact/
          cp evidence/openwrt-commit.txt evidence/feeds.conf.default evidence/diffconfig.txt evidence/full.config artifact/
          find openwrt/build_dir -type f -path '*/ath11k/ath11k.ko' -exec sha256sum '{}' \; > artifact/ath11k-module-build-hashes.txt
          test -s artifact/ath11k-module-build-hashes.txt
          cd artifact
          sha256sum *.bin > SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb1-mx4200-v1-25.12.5-ath11k-five-ring-experimental
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Upload compressed diagnostics
        if: always()
        run: tar -czf build-evidence.tar.gz evidence

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics
          path: build-evidence.tar.gz
          retention-days: 7
